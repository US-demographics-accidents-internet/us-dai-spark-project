version: "3.8"

services:

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns

  spark_job:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark_training

    environment:
      - SPARK_JAVA_OPTS=-Xmx1g -Xms512m
      - MLFLOW_TRACKING_URI=http://mlflow:5000

    depends_on:
      - mlflow

    volumes:
      - C:/Users/oplys/Documents/Markiian/us-dai-spark-project:/app/us-dai-spark-project
      - C:/Users/oplys/Documents/Markiian/Data:/app/Data

    working_dir: /app/us-dai-spark-project
    command: python main.py

volumes:
  mlruns:
